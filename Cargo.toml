[package]
name = "simple-media-overlay"
version = "0.2.0"
edition = "2021"
description = "Simple Media Overlay :D"

[[bin]]
name = "simple-media-overlay"
path = "src/main.rs"

[dependencies]
slint = "1.8"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp", "bmp", "ico"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tray-icon = "0.19"

rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }

[target.'cfg(target_os = "windows")'.dependencies]
i-slint-backend-winit = "1.8"
winit = "0.30"

[build-dependencies]
slint-build = "1.8"

[features]
default = ["video"]
video = []

[profile.release]
opt-level = "z"  
lto = true
strip = true
